<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FGCU Campus Map</title>
    <meta name="description" content="Find the shortest or quickest walking route between buildings on the FGCU campus." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header class="panel__head">
          <h1>FGCU Campus Map</h1>
          <p>Pick two buildings, or tap them on the map.</p>
        </header>

        <div class="field">
          <label for="start">Start</label>
          <select id="start"></select>
        </div>

        <button type="button" id="swap" class="swap" title="Swap start and destination">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v13M7 4 4 7.5M7 4l3 3.5M17 20V7m0 13 3-3.5M17 20l-3-3.5"/></svg>
          Swap
        </button>

        <div class="field">
          <label for="end">Destination</label>
          <select id="end"></select>
        </div>

        <div class="field">
          <span class="field__label">Route by</span>
          <div class="segmented" role="radiogroup" aria-label="Route preference">
            <label><input type="radio" name="mode" value="shortest" checked /><span>Shortest</span></label>
            <label><input type="radio" name="mode" value="quickest" /><span>Quickest</span></label>
          </div>
        </div>

        <div id="summary" class="summary" aria-live="polite"></div>

        <ol id="steps" class="steps"></ol>

        <footer class="panel__foot">
          <button type="button" id="clear" class="ghost">Clear route</button>
        </footer>
      </aside>

      <main class="map">
        <svg id="map" role="img" aria-label="Map of FGCU campus buildings and walkways">

              <rect x="175.996" y="104.506" style="fill:#f7f7f7;" width="160.003" height="64.003"/>

              <rect x="391.996" y="248.506" style="fill:#1280c8;" width="48" height="112.003"/>
              <rect x="72" y="360.498" style="fill:#f7d405;" width="48" height="40.003"/>

              <rect x="24" y="432.498" style="fill:#f7f7f7;" width="463.996" height="64.003"/>
              <rect x="216" y="384.498" style="fill:#f7d405;" width="79.996" height="72"/>
              <rect x="168" y="328.502" style="fill:#1280c8;" width="175.996" height="32"/>
              <rect y="495.834" style="fill:#1D1D1B;" width="511.996" height="15.659"/>
              <rect y="209.619" style="fill:#1D1D1B;" width="511.996" height="15.659"/>

              <path style="fill:#DD342E;" d="M381.015,47.558l91.392,341.071l-85.274,22.846L295.75,70.404L381.015,47.558z"/>
              <path style="fill:#199172;" d="M282.483,199.615H88.276c-4.882,0-8.828-3.955-8.828-8.828c0-4.873,3.946-8.828,8.828-8.828h194.207c4.882,0,8.828,3.955,8.828,8.828C291.31,195.66,287.364,199.615,282.483,199.615"/>

            </symbol>
          </defs>

          <g id="viewport">
          <g id="layer-terrain" aria-hidden="true">
            <rect class="ground" x="-400" y="-400" width="1800" height="1740" />

            <!-- preserve / tree canopy -->
            <path class="woods" d="M-60 640 C60 605 205 660 300 700 C365 727 340 820 300 900 C260 972 100 990 -60 990 Z" />
            <path class="woods" d="M-60-60 C80-60 222-28 250 60 C276 142 200 232 120 270 C40 306-60 292-60 292 Z" />
            <path class="woods" d="M112 330 C192 308 252 362 245 442 C238 542 200 622 130 642 C92 652 96 480 112 330 Z" />
            <path class="woods" d="M1060 430 C968 452 880 500 870 590 C860 692 942 742 1060 752 Z" />
            <path class="woods" d="M470 990 C500 930 560 928 600 955 C630 975 632 990 632 990 Z" />

            <!-- surface parking -->
            <rect class="lot" x="300" y="140" width="220" height="76" rx="6" />
            <rect class="lot" x="710" y="192" width="142" height="78" rx="6" />
            <rect class="lot" x="372" y="690" width="168" height="66" rx="6" />

            <!-- athletic fields -->
            <rect class="field" x="678" y="386" width="176" height="104" rx="4" />
            <rect class="field" x="892" y="772" width="112" height="118" rx="4" />

            <!-- water -->
            <ellipse class="water" cx="690" cy="675" rx="136" ry="82" />
            <ellipse class="water" cx="470" cy="545" rx="95" ry="60" />
            <ellipse class="water" cx="176" cy="722" rx="84" ry="50" />
          </g>

            <g id="layer-paths"></g>
            <g id="layer-route"></g>
            <g id="layer-nodes"></g>
            <g id="layer-labels"></g>
          </g>
        </svg>

        <div class="map__controls">
          <button type="button" data-zoom="in" title="Zoom in" aria-label="Zoom in">+</button>
          <button type="button" data-zoom="out" title="Zoom out" aria-label="Zoom out">&minus;</button>
          <button type="button" data-zoom="reset" title="Reset view" aria-label="Reset view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4"/></svg>
          </button>
        </div>

        <p class="map__hint" id="hint">Tap a building to set your start</p>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
