<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FGCU Campus Map</title>
    <meta name="description" content="Find the shortest or quickest walking route between buildings on the FGCU campus." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel" id="panel">
        <header class="panel__head">
          <h1>FGCU Campus Map</h1>
          <p>Pick two buildings, or tap them on the map.</p>
        </header>

        <div class="field">
          <label for="start">Start</label>
          <select id="start"></select>
        </div>

        <button type="button" id="swap" class="swap" title="Swap start and destination">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v13M7 4 4 7.5M7 4l3 3.5M17 20V7m0 13 3-3.5M17 20l-3-3.5"/></svg>
          Swap
        </button>

        <div class="field">
          <label for="end">Destination</label>
          <select id="end"></select>
        </div>

        <div class="field">
          <span class="field__label">Route by</span>
          <div class="segmented" role="radiogroup" aria-label="Route preference">
            <label><input type="radio" name="mode" value="shortest" checked /><span>Shortest</span></label>
            <label><input type="radio" name="mode" value="quickest" /><span>Quickest</span></label>
          </div>
        </div>

        <div id="summary" class="summary" aria-live="polite"></div>

        <ol id="steps" class="steps"></ol>

        <footer class="panel__foot">
          <button type="button" id="clear" class="ghost">Clear route</button>
        </footer>
      </aside>
