name: Deploy campus map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild campus.json from fgcu.csv
        run: node FGCU_Map/build-data.js

      - name: Fail if the committed data is out of date
        run: git diff --exit-code FGCU_Map/campus.json

  # Deploying is opt-in for now: Pages is not enabled on the repo yet, and
  # actions/configure-pages fails if it cannot find a Pages site. Pushes still
  # run `verify` and stay green, while this job reports as Skipped.
  #
  # To go live: enable Pages (Settings -> Pages -> Source: GitHub Actions),
  # then delete the `if:` line below so every push to main deploys.
  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The repo root is published, not web/, because web/app.js imports the
      # shared graph and data from ../FGCU_Map/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
